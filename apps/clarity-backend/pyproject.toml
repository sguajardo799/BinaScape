[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "clarity-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "PyYAML>=6.0",
    "pyclarity==0.8.0",
    "scipy>=1.17",
    "soundfile>=0.13",
]

[project.scripts]
clarity-backend = "clarity_backend.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clarity_backend"]
