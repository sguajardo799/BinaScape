[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "acoustic-orchestrator"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0.1",
  "typer>=0.12",
  "rich>=13.7",
]
# Clarity sigue como backend hermano invocado por subprocess/uv run --project.
# No se agrega como dependencia directa del orchestrator en esta slice.

[project.scripts]
acoustic-orchestrator = "acoustic_orchestrator.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/acoustic_orchestrator"]
