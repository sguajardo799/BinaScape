# Array estático renderizado con Pyroomacoustics (ISM), sin MATLAB/ITA/RAVEN.
# Requiere el extra opcional: uv sync --package acoustic-orchestrator --extra pyroomacoustics
# Los órdenes ISM provienen de la calibración de la tarea 7.7 (ver openspec/changes/
# add-pyroomacoustics-render-backend/verification.md). Pyroomacoustics y RAVEN no producen
# salas acústicamente equivalentes; use el T30 medido como etiqueta.
experiment:
  experiment_id: circular_array_pyroomacoustics
  description: Array circular horizontal de tres micrófonos omnidireccionales renderizado con Pyroomacoustics.
  scene_type: static
  random_seed: 42
execution:
  num_simulations: 1
  num_workers: 1
  overwrite_existing: false
  resume_if_possible: true
  save_scene_manifest: true
  save_render_metadata: true
render:
  backend: pyroomacoustics
  sample_rate_hz: 44100
pyroomacoustics:
  # 7.7: 0 % rechazos T30 y error <= 6 % frente a orden 150 en salas de RT medio; ~18 s/variante.
  # Salas largas y poco difusas no convergen a órdenes asequibles (ISM especular sin scattering).
  max_order: 100
  # Explícito a propósito: el ISM poliédrico (trapecio/L) crece ~paredes^orden y, a órdenes
  # asequibles, la puerta T30 rechaza esas salas. Este ejemplo solo usa shoebox.
  max_order_non_shoebox: 8
  air_absorption: true
background_noise:
  enabled: true
  allow_multiple_layers: false
  snr_db: 20.0
  strategies:
    - type: colored
      colors: [white, pink, brown]
receiver_sampling:
  one_receiver_per_scene: true
  position_strategy:
    type: random_uniform_inside_room
    margin_m: {x: 0.5, y: 0.0, z: 0.5}
    fixed_height_m: {min: 1.5, max: 1.6}
  orientation_strategy:
    type: random_yaw
    yaw_deg: {min: -180.0, max: 180.0}
    pitch_deg: {fixed: 0.0}
    roll_deg: {fixed: 0.0}
receiver_outputs:
  circular_array:
    enabled: true
    num_microphones: 3
    radius_m: 0.05
    output_subdir: circular_array
    required: true
room_sampling:
  reverberation:
    metric: estimated_rt30_s
    estimator: sabine
    estimator_version: sabine_polygon_octaves_v4
    aggregation: arithmetic_mean
    mean_bands_hz: [125, 250, 500, 1000, 2000, 4000, 8000]
    distribution: {type: uniform, scope: global, range_s: {min: 0.2, max: 1.0}, bin_width_s: 0.1, quota_tolerance_fraction: 0.15}
    treatment: {catalog_version: 1, mix_model: area_weighted_linear, mix_model_version: 1, eligible_surface_types: [wall, ceiling], max_treatments_per_surface: 1, preserve_base_scattering: true, allow_none: true, wall_coverage: {min: 0.0, max: 1.0}, ceiling_coverage: {min: 0.0, max: 1.0}}
  geometry:
    height_m: {min: 2.6, max: 2.8}
    shape_mix:
      - type: shoebox
        probability: 1.0
        length_m: {min: 4.2, max: 4.5}
        width_m: {min: 3.6, max: 4.0}
  materials:
    walls: [bricks]
    floor: [wood]
    ceiling: [plaster]
source_sampling:
  min_sources: 2
  max_sources: 2
  timing:
    allow_offsets: true
    start_time_s: {min: 0.0, max: 0.5}
    total_duration_s: 2.0
  gain_db: {min: -6.0, max: 0.0}
  default_orientation_strategy:
    type: random_yaw
    yaw_deg: {min: -180.0, max: 180.0}
    pitch_deg: {fixed: 0.0}
    roll_deg: {fixed: 0.0}
  source_types:
    - event_type: speech
      role: base
      min_count: 2
      max_count: 2
      probability: 1.0
      audio_dir: ../../assets/events/train/speech/
      spatial_policy: {type: random_valid}
scene_validation:
  min_distance_source_to_receiver_m: 0.5
  min_distance_between_sources_m: 0.2
  require_sources_inside_room: true
  require_receiver_inside_room: true
  max_scene_attempts: 50
  max_receiver_attempts: 50
outputs:
  artifact_root: ../../outputs/
  run_name: circular_array_pyroomacoustics
  naming:
    scene_id_prefix: scene_static
    wav_pattern: '{scene_id}__{output_type}.wav'
    metadata_pattern: '{scene_id}__{output_type}__render.json'
hearing_degradation:
  enabled: false
  input_targets: []
  hearing_profiles_path: ../hearing/example_profile.yaml
