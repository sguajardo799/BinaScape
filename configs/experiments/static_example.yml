experiment:
  experiment_id: e2e_raven_rt30_binaural_20260921
  description: >
    Validacion E2E pequena de RAVEN estatico y Clarity: dos escenas,
    dos HRTF binaurales por escena, dos fuentes y perfil symmetric_moderate_loss.
    HARTF queda pendiente porque sus catalogos locales estan vacios.
  scene_type: static
  random_seed: 42

execution:
  num_simulations: 2
  num_workers: 1
  overwrite_existing: false
  resume_if_possible: false
  save_scene_manifest: true
  save_render_metadata: true

raven:
  base_rpf_file: C:/ITASoftware/Raven/RavenInput/Classroom/Classroom.rpf

render:
  sample_rate_hz: 44100
  generate_rir: false
  generate_brir: true
  simulation_type_rt: true
  simulation_type_is: true
  num_particles: 60000
  is_order_ps: 2

background_noise:
  enabled: false
  allow_multiple_layers: false
  strategies: []

receiver_sampling:
  one_receiver_per_scene: true

  position_strategy:
    type: random_uniform_inside_room
    margin_m:
      x: 0.5
      y: 0.0
      z: 0.5
    fixed_height_m:
      min: 1.55
      max: 1.70

  orientation_strategy:
    type: random_yaw
    yaw_deg:
      min: -180.0
      max: 180.0
    pitch_deg:
      fixed: 0.0
    roll_deg:
      fixed: 0.0

receiver_outputs:
  binaural_hrtf:
    enabled: true
    ir_catalog_path: ../../assets/hrtf/
    file_pattern: "*.daff"
    num_hrtfs: 2
    output_subdir: binaural_hrtf
    num_channels: 2
    required: true

  # HARTF no habilitado: assets/hartf/rear y assets/hartf/front estan vacios.
  # Para cubrir tres salidas, aportar DAFF HARTF reales, configurar ambas
  # salidas con esos catalogos y agregarlas a hearing_degradation.input_targets.

room_sampling:
  # LÃ­mite Sabine estimado antes de generar receptor, fuentes y manifiesto.
  max_rt30_s: 1.0
  dimensions_m:
    length:
      min: 3.5
      max: 6.5
    width:
      min: 3.5
      max: 6.5
    height:
      min: 1.8
      max: 2.5

  materials:
    walls:
      - bricks
      - concrete
      - glass
      - drywall
    floor:
      - wood
      - plaster
    ceiling:
      - wood
      - plaster

  semantic_surfaces:
    enable_walls: true
    enable_floor: true
    enable_ceiling: true

source_sampling:
  min_sources: 2
  max_sources: 2
  timing:
    allow_offsets: true
    start_time_s:
      min: 0.1
      max: 5.5
    total_duration_s: 10.0
  gain_db:
    min: -6.0
    max: 0.0
  default_orientation_strategy:
    type: random_yaw
    yaw_deg:
      min: -180.0
      max: 180.0
    pitch_deg:
      fixed: 0.0
    roll_deg:
      fixed: 0.0
  source_types:
    - event_type: speech
      role: base
      min_count: 1
      max_count: 1
      probability: 1.0
      audio_dir: ../../assets/events/train/speech/
      directivity: ../../assets/directivity/Singer_2011_FWE_TLE_norm.daff
      spatial_policy:
        type: random_valid

    - event_type: keyboard_typing
      role: base
      min_count: 1
      max_count: 1
      probability: 1.0
      audio_dir: ../../assets/events/train/keyboard_typing/
      spatial_policy:
        type: random_valid

scene_validation:
  min_distance_source_to_receiver_m: 0.5
  min_distance_between_sources_m: 0.2
  require_sources_inside_room: true
  require_receiver_inside_room: true
  max_sampling_attempts_per_scene: 50

outputs:
  artifact_root: ../../outputs/
  run_name: e2e_raven_rt30_binaural_multi_hrtf_20260922
  # Corrida nueva: no sobrescribir manifiestos ni reutilizar resultados.

  naming:
    scene_id_prefix: scene_static
    wav_pattern: "{scene_id}__{output_type}.wav"
    metadata_pattern: "{scene_id}__{output_type}__render.json"

hearing_degradation:
  enabled: true
  input_targets:
    - binaural_hrtf
  hearing_profiles_path: ../hearing/example_profile.yaml
  runner:
    backend_project_path: ../../apps/clarity-backend
    entrypoint: clarity-backend
    auto_submit: true
    use_uv: true
    force_rerun: false
