# HRTF + array; agregar salidas HARTF solo con DAFF reales.
experiment:
  experiment_id: circular_array_mixed
  description: HRTF binaural y array circular; Clarity solo sobre HRTF.
  scene_type: static
  random_seed: 42
execution:
  num_simulations: 10
  num_workers: 1
  overwrite_existing: false
  resume_if_possible: true
  save_scene_manifest: true
  save_render_metadata: true
raven:
  base_rpf_file: C:/ITASoftware/Raven/RavenInput/Classroom/Classroom.rpf
render:
  sample_rate_hz: 44100
receiver_sampling:
  one_receiver_per_scene: true
  position_strategy:
    type: random_uniform_inside_room
    margin_m: {x: 0.5, y: 0.0, z: 0.5}
    fixed_height_m: {min: 1.5, max: 1.6}
  orientation_strategy:
    type: random_yaw
    yaw_deg: {min: -180.0, max: 180.0}
    pitch_deg: {fixed: 0.0}
    roll_deg: {fixed: 0.0}
receiver_outputs:
  binaural_hrtf:
    enabled: true
    ir_catalog_path: ../../assets/hrtf/
    file_pattern: '*.daff'
    num_hrtfs: 1
    output_subdir: binaural_hrtf
    num_channels: 2
    required: true
  circular_array:
    enabled: true
    num_microphones: 3
    radius_m: 0.05
    output_subdir: circular_array
    required: true
room_sampling:
  reverberation:
    metric: estimated_rt30_s
    estimator: sabine
    estimator_version: sabine_polygon_octaves_v4
    aggregation: arithmetic_mean
    mean_bands_hz: [125, 250, 500, 1000, 2000, 4000, 8000]
    distribution: {type: uniform, scope: global, range_s: {min: 0.2, max: 1.0}, bin_width_s: 0.1, quota_tolerance_fraction: 0.15}
    treatment: {catalog_version: 1, mix_model: area_weighted_linear, mix_model_version: 1, eligible_surface_types: [wall, ceiling], max_treatments_per_surface: 1, preserve_base_scattering: true, allow_none: true, wall_coverage: {min: 0.0, max: 1.0}, ceiling_coverage: {min: 0.0, max: 1.0}}
  geometry:
    height_m: {min: 2.6, max: 2.8}
    shape_mix:
      - type: shoebox
        probability: 1.0
        length_m: {min: 4.2, max: 4.5}
        width_m: {min: 3.6, max: 4.0}
  materials:
    walls: [bricks]
    floor: [wood]
    ceiling: [plaster]
source_sampling:
  min_sources: 2
  max_sources: 2
  timing:
    allow_offsets: false
    start_time_s: {min: 0.0, max: 0.0}
    total_duration_s: 5.0
  gain_db: {min: -6.0, max: 0.0}
  default_orientation_strategy:
    type: random_yaw
    yaw_deg: {min: -180.0, max: 180.0}
    pitch_deg: {fixed: 0.0}
    roll_deg: {fixed: 0.0}
  source_types:
    - event_type: speech
      role: base
      min_count: 2
      max_count: 2
      probability: 1.0
      audio_dir: ../../assets/events/train/speech/
      spatial_policy: {type: random_valid}
scene_validation:
  min_distance_source_to_receiver_m: 0.5
  min_distance_between_sources_m: 0.2
  require_sources_inside_room: true
  require_receiver_inside_room: true
  max_scene_attempts: 50
  max_receiver_attempts: 50
outputs:
  artifact_root: ../../outputs/
  run_name: circular_array_mixed
  naming:
    scene_id_prefix: scene_static
    wav_pattern: '{scene_id}__{output_type}.wav'
    metadata_pattern: '{scene_id}__{output_type}__render.json'
hearing_degradation:
  enabled: true
  input_targets: [binaural_hrtf]
  hearing_profiles_path: ../hearing/example_profile.yaml
  runner:
    backend_project_path: ../../apps/clarity-backend
    entrypoint: clarity-backend
    auto_submit: false
    use_uv: true
